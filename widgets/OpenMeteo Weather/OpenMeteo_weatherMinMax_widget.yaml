component: f7-card
config:
  class:
    - padding
  style:
    text-align: center
slots:
  default:
    - component: f7-row
      config:
        visible: '=props.show_current_temp'
        style:
          margin-bottom: 15px
      slots:
        default:
          - component: Label
            config:
              text: '=((props.current_label || "Aktuell") + ": ") + (props.temp_format === "integer" ? Math.round(#props.current_temp) + " °C" : @props.current_temp || "")'
              style:
                font-size: 16px
                font-weight: 500
                width: 100%
                white-space: nowrap
    - component: f7-row
      config:
        visible: '=props.forecast_layout === "wrap"'
        style:
          display: flex
          flex-wrap: wrap
          gap: 8px
          width: 100%
      slots:
        default:
          - component: f7-col
            config:
              style:
                flex: 1 1 80px
                min-width: 80px
                max-width: 110px
                width: 100%
                display: flex
                flex-direction: column
                justify-content: center
                align-items: center
            slots:
              default:
                - component: Label
                  config:
                    text: '=(props.today_label || "Heute")'
                    style: {font-weight: bold, width: '100%', text-align: center}
                - component: oh-icon
                  config:
                    icon: '="f7:" + @props.wmo_today'
                    width: 46
                    style:
                      display: block
                      margin: 0 auto
                - component: Label
                  config:
                    style: {fontSize: 11px, white-space: nowrap, width: '100%', text-align: center}
                    text: '=(props.temp_format === "integer" ? Math.round(#props.temp_min_today) + " °C" : @props.temp_min_today || "–") + " | " + (props.temp_format === "integer" ? Math.round(#props.temp_max_today) + " °C" : @props.temp_max_today || "–")'
          - component: f7-col
            config:
              style:
                flex: 1 1 80px
                min-width: 80px
                max-width: 110px
                width: 100%
                display: flex
                flex-direction: column
                justify-content: center
                align-items: center
            slots:
              default:
                - component: Label
                  config:
                    text: '=dayjs().add(1,"day").format("dddd")'
                    style: {font-weight: bold, width: '100%', text-align: center}
