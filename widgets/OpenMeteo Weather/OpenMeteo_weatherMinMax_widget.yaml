uid: weatherMinMax_v2
tags:
  - temperature
  - weather
props:
  parameters:
    - name: show_current_temp
      label: Aktuelle Temperatur anzeigen
      type: BOOLEAN
      default: false
    - name: extended_forecast
      label: 7-Tage-Vorhersage anzeigen
      type: BOOLEAN
      default: false
    - name: forecast_layout
      label: Tagesdarstellung
      type: TEXT
      default: wrap
      limitToOptions: true
      options:
        - value: wrap
          label: Umbrechen
        - value: slider
          label: Horizontaler Scroll
    - name: temp_format
      label: Temperaturformat
      type: TEXT
      default: item
      limitToOptions: true
      options:
        - value: item
          label: Wie im Item formatiert
        - value: integer
          label: Ganzzahl (z.B. 12 °C)
    - name: current_label
      label: Text für "Aktuell"
      type: TEXT
      default: Aktuell
    - name: today_label
      label: Text für "Heute"
      type: TEXT
      default: Heute
    - name: current_temp
      label: Aktuelle Temperatur
      type: TEXT
      context: item
    - name: wmo_today
      label: WMO Code Heute
      type: TEXT
      context: item
      default: OpenMeteo_weather_forecast_WMO_code_Today
    - name: wmo_tomorrow
      label: WMO Code Morgen
      type: TEXT
      context: item
      default: OpenMeteo_weather_forecast_WMO_code_Tomorrow
    - name: wmo_day2
      label: WMO Code Tag 2
      type: TEXT
      context: item
      default: OpenMeteo_weather_forecast_WMO_code_Day_2
    - name: wmo_day3
      label: WMO Code Tag 3
      type: TEXT
      context: item
      default: OpenMeteo_weather_forecast_WMO_code_Day_3
    - name: wmo_day4
      label: WMO Code Tag 4
      type: TEXT
      context: item
      default: OpenMeteo_weather_forecast_WMO_code_Day_4
    - name: wmo_day5
      label: WMO Code Tag 5
      type: TEXT
      context: item
      default: OpenMeteo_weather_forecast_WMO_code_Day_5
    - name: wmo_day6
      label: WMO Code Tag 6
      type: TEXT
      context: item
      default: OpenMeteo_weather_forecast_WMO_code_Day_6
    - name: temp_max_today
      label: Max Temp Heute
      type: TEXT
      context: item
      default: OpenMeteo_weather_forecast_Maximum_outdoor_temperature_Today
    - name: temp_min_today
      label: Min Temp Heute
      type: TEXT
      context: item
      default: OpenMeteo_weather_forecast_Minimum_outdoor_temperature_Today
    - name: temp_max_tomorrow
      label: Max Temp Morgen
      type: TEXT
      context: item
      default: OpenMeteo_weather_forecast_Maximum_outdoor_temperature_Tomorrow
    - name: temp_min_tomorrow
      label: Min Temp Morgen
      type: TEXT
      context: item
      default: OpenMeteo_weather_forecast_Minimum_outdoor_temperature_Tomorrow
    - name: temp_max_day2
      label: Max Temp Tag 2
      type: TEXT
      context: item
      default: OpenMeteo_weather_forecast_Maximum_outdoor_temperature_Day_2
    - name: temp_min_day2
      label: Min Temp Tag 2
      type: TEXT
      context: item
      default: OpenMeteo_weather_forecast_Minimum_outdoor_temperature_Day_2
    - name: temp_max_day3
      label: Max Temp Tag 3
      type: TEXT
      context: item
      default: OpenMeteo_weather_forecast_Maximum_outdoor_temperature_Day_3
    - name: temp_min_day3
      label: Min Temp Tag 3
      type: TEXT
      context: item
      default: OpenMeteo_weather_forecast_Minimum_outdoor_temperature_Day_3
    - name: temp_max_day4
      label: Max Temp Tag 4
      type: TEXT
      context: item
